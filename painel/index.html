<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Leilões — Caixa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#1C60AB; --azul-escuro:#0B2E57; --azul-hover:#0E3F78; --azul-suave:#E8F0FA; --azul-borda:#C8DAF0;
    --laranja:#EF9C00; --laranja-suave:#FFE3A8; --laranja-texto:#5C3A00; --urgente:#A35200;
    --bg:#F4F6F9; --card:#FFFFFF; --linha:#DDE3EA; --linha-suave:#EEF1F5; --campo:#CDD5DF;
    --ink:#16202E; --ink-2:#3E4A5C; --ink-3:#566273;
    --verde:#1F5E3A; --verde-suave:#DDF1E4; --vermelho:#A1302A; --vermelho-suave:#FBEAE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;line-height:1.45;font-variant-numeric:tabular-nums;}
  a{color:var(--azul);} a:hover{color:var(--azul-hover);}
  button,input,select{font:inherit;}
  h1,h2,h3{margin:0;}
  :focus-visible{outline:3px solid #7FB0E6;outline-offset:2px;}
  .oculto{display:none !important;}

  /* ---------- login ---------- */
  #login-screen{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--azul);padding:16px;}
  .login-card{width:100%;max-width:360px;padding:32px;background:#fff;border-radius:12px;border-top:4px solid var(--laranja);box-shadow:0 10px 30px rgba(0,0,0,.2);}
  .login-card h2{font-size:22px;color:var(--azul-escuro);margin-bottom:4px;}
  .login-card p.sub{color:var(--ink-3);font-size:14px;margin:0 0 20px;}
  .login-card label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px;}
  .login-card input{width:100%;font-size:15px;padding:0 12px;min-height:44px;border:1px solid var(--campo);border-radius:8px;background:#fff;margin-bottom:14px;}
  .campo-senha{position:relative;}
  .campo-senha input{padding-right:44px;}
  .login-card .btn-mostrar-senha{position:absolute;right:10px;top:22px;transform:translateY(-50%);width:auto;background:none;border:none;cursor:pointer;color:var(--ink-3);padding:0;display:flex;}
  .login-card .btn-mostrar-senha:hover{color:var(--ink);}
  .btn-mostrar-senha svg{width:20px;height:20px;}
  #btn-entrar{width:100%;font-weight:700;font-size:15px;min-height:46px;border-radius:8px;border:none;background:var(--azul);color:#fff;cursor:pointer;}
  #btn-entrar:hover{background:var(--azul-hover);}
  #btn-entrar:disabled{opacity:.7;cursor:wait;}
  #login-erro{color:var(--vermelho);font-size:13px;margin-top:12px;display:none;}

  /* ---------- cabeçalho ---------- */
  .topo{background:var(--azul);border-bottom:3px solid var(--laranja);position:relative;z-index:20;}
  .topo-in{max-width:1180px;margin:0 auto;padding:0 24px;min-height:60px;display:flex;flex-wrap:wrap;align-items:center;gap:28px;}
  .marca{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;background:none;border:none;cursor:pointer;padding:0;}
  .nav-topo{display:flex;gap:4px;align-self:stretch;}
  .nav-topo button{display:flex;align-items:center;padding:0 14px;color:#DCE8F6;background:none;border:none;font-weight:500;font-size:15px;cursor:pointer;}
  .nav-topo button[aria-current="page"]{color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 var(--laranja);}
  .topo-dir{margin-left:auto;display:flex;align-items:center;gap:16px;}
  #status-topo{font-size:13px;color:#DCE8F6;}
  #status-topo.alerta{color:var(--azul-escuro);background:var(--laranja-suave);border-radius:20px;padding:4px 12px;font-weight:600;}
  .conta{position:relative;}
  .btn-conta{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid #5A8CC6;border-radius:22px;padding:4px 12px 4px 4px;color:#fff;font-size:14px;cursor:pointer;min-height:40px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--laranja);color:var(--azul-escuro);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .menu-conta{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--linha);border-radius:10px;box-shadow:0 8px 24px rgba(18,36,55,.16);min-width:220px;padding:6px;}
  .menu-conta button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 12px;border-radius:6px;font-size:14px;color:var(--ink);cursor:pointer;}
  .menu-conta button:hover{background:var(--bg);}

  main{max-width:1180px;margin:0 auto;padding:28px 24px 96px;display:flex;flex-direction:column;gap:20px;}
  .faixa{display:flex;flex-wrap:wrap;align-items:center;gap:14px;border-radius:12px;padding:14px 18px;font-size:14px;}
  .faixa p{margin:0;flex:1 1 320px;}
  .faixa-info{background:var(--azul-suave);border:1px solid var(--azul-borda);}
  .faixa-aviso{background:#FFF4DE;border:1px solid #F2C46B;color:#3D2600;}
  .faixa-aviso a{color:#6B3A00;font-weight:600;}

  /* ---------- botões ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;border-radius:8px;padding:0 14px;min-height:40px;cursor:pointer;text-decoration:none;white-space:nowrap;}
  .btn-pri{background:var(--azul);color:#fff;border:1px solid var(--azul);font-weight:600;}
  .btn-pri:hover{background:var(--azul-hover);color:#fff;}
  .btn-sec{background:#fff;color:var(--ink);border:1px solid var(--campo);}
  .btn-sec:hover{border-color:var(--ink-3);}
  .btn-texto{background:none;border:none;color:var(--azul);font-weight:600;padding:0 6px;}
  .btn-perigo{background:#fff;color:var(--vermelho);border:1px solid #F0C9C5;}
  .btn-perigo:hover{background:var(--vermelho-suave);}
  .btn-perigo-cheio{background:var(--vermelho);color:#fff;border:1px solid var(--vermelho);font-weight:600;}
  .btn-icone{width:40px;padding:0;}
  .btn-fav-ativo{background:var(--laranja-suave);border-color:#F2C46B;color:var(--laranja-texto);font-weight:600;}
  .btn svg{width:17px;height:17px;flex-shrink:0;}
  .btn-lg{min-height:44px;font-size:15px;padding:0 18px;}

  .tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;}
  .tag-filtro{color:#164F8F;background:var(--azul-suave);}
  .tag-novo{color:var(--laranja-texto);background:var(--laranja-suave);font-weight:700;}
  .tag-fin{color:var(--verde);background:var(--verde-suave);}
  .tag-pausado{color:var(--ink-3);background:var(--linha-suave);}

  .titulo-pag{font-size:28px;font-weight:700;color:var(--azul-escuro);letter-spacing:-.01em;}
  .sub-pag{margin:6px 0 0;font-size:15px;color:#4A5668;}
  .cabeca-pag{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;}

  /* ---------- alertas ---------- */
  .grade-alertas{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;}
  .alerta{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;}
  .alerta.pausado{background:#FAFBFC;}
  .alerta h2{font-size:17px;font-weight:600;color:var(--azul-escuro);}
  .alerta dl{margin:0;display:grid;grid-template-columns:96px 1fr;row-gap:6px;font-size:14px;}
  .alerta dt{color:var(--ink-3);} .alerta dd{margin:0;}
  .alerta-num{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--linha-suave);font-size:14px;}
  .alerta-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .vazio{text-align:center;padding:56px 20px;color:var(--ink-3);background:var(--card);border:1px dashed var(--campo);border-radius:12px;}
  .vazio h3{color:var(--ink);margin-bottom:6px;font-size:17px;}

  /* ---------- imóveis ---------- */
  .abas{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #D5DDE6;}
  .abas button{display:inline-flex;align-items:center;gap:8px;padding:0 14px;min-height:44px;font-size:15px;font-weight:500;color:var(--ink-2);background:none;border:none;cursor:pointer;}
  .abas button[aria-current="page"]{font-weight:600;color:var(--azul-escuro);box-shadow:inset 0 -3px 0 var(--azul);}
  .abas .n{font-size:12px;font-weight:700;background:var(--linha-suave);color:var(--ink-2);border-radius:10px;padding:1px 8px;}
  .abas button[aria-current="page"] .n{background:var(--azul-suave);color:#164F8F;}
  .ferramentas{background:var(--card);border:1px solid var(--linha);border-radius:12px;}
  .ferr-linha{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 16px;}
  .campo{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#4A5668;}
  .campo input,.campo select{font-size:14px;font-weight:400;color:var(--ink);border:1px solid var(--campo);border-radius:8px;padding:0 10px;min-height:40px;background:#fff;}
  .mais-filtros{border-top:1px solid var(--linha-suave);padding:20px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px 32px;}
  .mais-filtros fieldset{border:none;margin:0;padding:0;}
  .mais-filtros legend{font-size:14px;font-weight:600;color:var(--azul-escuro);padding:0;margin-bottom:10px;}
  .pilulas{display:flex;flex-wrap:wrap;gap:8px;}
  .pilula{font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--campo);border-radius:20px;padding:0 14px;min-height:36px;cursor:pointer;}
  .pilula[aria-pressed="true"]{background:var(--azul-suave);color:var(--azul-escuro);border-color:var(--azul);font-weight:600;}
  .segmento{display:inline-flex;flex-wrap:wrap;background:#E3E8EF;border-radius:10px;padding:4px;gap:2px;}
  .segmento button{font-size:14px;background:transparent;color:var(--ink-2);border:none;border-radius:7px;padding:0 12px;min-height:34px;cursor:pointer;}
  .segmento button[aria-pressed="true"]{background:#fff;color:var(--azul-escuro);font-weight:600;}
  .marcar{display:flex;align-items:center;gap:10px;font-size:14px;min-height:30px;cursor:pointer;}
  .marcar input{width:18px;height:18px;accent-color:var(--azul);}
  .ferr-rodape{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--linha-suave);padding:12px 16px;background:#FAFBFC;border-radius:0 0 12px 12px;}
  .chips-ativos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink-3);}
  .chip-x{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--azul-escuro);background:var(--azul-suave);border:none;border-radius:20px;padding:0 8px 0 12px;min-height:32px;cursor:pointer;}
  .chip-x svg{width:13px;height:13px;}
  .bairro-filtro{position:relative;}
  .bairro-filtro summary{list-style:none;cursor:pointer;font-size:14px;font-weight:400;color:var(--ink);padding:0 12px;min-height:40px;display:flex;align-items:center;border:1px solid var(--campo);border-radius:8px;background:#fff;white-space:nowrap;}
  .bairro-filtro summary::-webkit-details-marker{display:none;}
  .bairro-filtro summary::after{content:' ▾';color:var(--azul);margin-left:4px;}
  .bairro-painel{position:absolute;z-index:15;top:calc(100% + 4px);left:0;min-width:300px;max-height:300px;overflow-y:auto;background:#fff;border:1px solid var(--linha);border-radius:8px;padding:10px;box-shadow:0 6px 18px rgba(18,36,55,.12);}
  .bairro-painel .acoes{display:flex;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--linha-suave);}
  .bairro-item{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--ink);padding:6px 2px;cursor:pointer;}
  .bairro-item input{flex:0 0 auto;margin:0;width:16px;height:16px;accent-color:var(--azul);}
  .bairro-item .nome{white-space:nowrap;flex:1;}
  .bairro-item .q{color:var(--ink-3);white-space:nowrap;margin-left:8px;}

  .barra-selecao{position:sticky;top:8px;z-index:12;background:var(--azul-escuro);color:#fff;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 20px rgba(11,46,87,.25);}
  .barra-selecao .linha{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .barra-selecao .btn-sec{border:none;color:var(--azul-escuro);font-weight:600;}
  .barra-selecao .btn-texto{color:#DCE8F6;text-decoration:underline;font-weight:400;}
  .barra-selecao p{margin:0;font-size:13px;color:#C9D8EA;}
  .contagem{font-size:14px;color:var(--ink-2);}

  .layout-imoveis{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;}
  .lista{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px;}
  .agenda-lateral{flex:1 1 280px;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;}
  .grupo-cab{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .grupo-cab label{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#4A5668;min-height:36px;cursor:pointer;}
  .grupo-cab input{width:18px;height:18px;accent-color:var(--azul);}
  .grupo-cab span{font-size:14px;color:var(--ink-3);}

  .imovel{background:var(--card);border:1px solid var(--linha);border-radius:12px;overflow:hidden;}
  .imovel.sel{border:2px solid var(--azul);background:#F3F8FE;}
  .imovel.destaque{box-shadow:0 0 0 3px var(--laranja);}
  .im-topo{display:flex;flex-wrap:wrap;gap:16px 20px;padding:20px;}
  .im-chk{flex:0 0 auto;padding-top:2px;}
  .im-chk input{width:20px;height:20px;accent-color:var(--azul);cursor:pointer;}
  .im-info{flex:999 1 280px;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .im-info h3{font-size:19px;font-weight:600;color:var(--azul-escuro);}
  .im-info p{margin:0;font-size:14px;color:var(--ink-2);}
  .im-info p.fatos{color:var(--ink-3);}
  .im-info .mapa{white-space:nowrap;font-weight:600;text-decoration:none;margin-left:6px;}
  .im-preco{flex:1 1 220px;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px;}
  .im-preco .rot{font-size:13px;color:var(--ink-3);}
  .im-preco .valor{font-size:28px;font-weight:700;color:var(--azul);letter-spacing:-.01em;}
  .im-preco .sub{font-size:13px;color:var(--ink-2);}
  .pracas{padding:0 20px 18px;}
  .pracas .mod{margin:0 0 8px;font-size:13px;font-weight:600;color:#4A5668;}
  .pracas ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .praca{border:1px solid #E3E8EF;border-radius:10px;padding:10px 12px;background:#fff;}
  .praca .l1{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);}
  .praca .l2{font-size:16px;font-weight:600;color:var(--ink);}
  .praca.passada{background:#F7F9FB;}
  .praca.passada .l1,.praca.passada .l2{color:#6A7587;}
  .praca.passada .l2{text-decoration:line-through;}
  .praca.atual{border:2px solid var(--azul);padding:9px 11px;}
  .praca.atual .l1{color:var(--azul-escuro);font-weight:600;}
  .praca.atual .l2{color:var(--azul-escuro);font-weight:700;}
  .praca.urgente{border-color:var(--urgente);}
  .quando{font-weight:700;color:#6B3A00;background:var(--laranja-suave);border-radius:20px;padding:0 8px;white-space:nowrap;}
  .quando.urgente{color:#fff;background:var(--urgente);}
  .custo-linha{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 20px 18px;padding:10px 14px;background:var(--bg);border-radius:10px;font-size:14px;}
  .im-edital{border-top:1px solid var(--linha-suave);padding:12px 20px;font-size:14px;}
  .im-edital summary{cursor:pointer;font-weight:600;color:var(--azul);}
  .im-edital dl{margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 20px;}
  .im-edital dt{font-size:12px;color:var(--ink-3);} .im-edital dd{margin:0;}
  .im-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--linha-suave);padding:12px 20px;background:#FAFBFC;}
  .linha-sem{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:#fff;border:1px solid var(--linha);border-radius:12px;padding:14px 18px;}
  .linha-sem.sel{border:2px solid var(--azul);background:#F3F8FE;padding:13px 17px;}
  .linha-sem .info{flex:999 1 260px;min-width:0;}
  .linha-sem h3{font-size:16px;font-weight:600;color:var(--azul-escuro);}
  .linha-sem p{margin:2px 0 0;font-size:14px;color:var(--ink-2);}

  .agenda-lista{list-style:none;margin:0;padding:0;}
  .agenda-lista li{padding:12px 0;border-top:1px solid var(--linha-suave);}
  .agenda-lista .dia{font-size:13px;font-weight:700;color:var(--ink-2);}
  .agenda-lista .dia.urgente{color:#8A3E00;}
  .agenda-lista button{display:block;background:none;border:none;padding:0;margin-top:2px;font-size:14px;color:var(--ink);text-align:left;cursor:pointer;}
  .agenda-lista button:hover{text-decoration:underline;}
  .agenda-lista .v{font-size:14px;font-weight:600;color:var(--azul);}
  .agenda-lista .v span{font-weight:400;color:var(--ink-3);}

  /* ---------- modal e toast ---------- */
  #modal-fundo{position:fixed;inset:0;background:rgba(11,26,46,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:560px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .modal.largo{max-width:880px;}
  .modal-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 28px 18px;border-bottom:1px solid #E3E8EF;}
  .modal-cab h2{font-size:22px;font-weight:700;color:var(--azul-escuro);}
  .modal-cab p{margin:4px 0 0;font-size:14px;color:var(--ink-3);}
  .modal-corpo{padding:22px 28px;display:flex;flex-direction:column;gap:20px;}
  .modal-rodape{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:16px 28px;border-top:1px solid #E3E8EF;}
  .modal fieldset{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .modal legend{font-size:15px;font-weight:600;color:var(--azul-escuro);padding:0;margin-bottom:12px;}
  .modal .campo{font-size:13px;color:var(--ink-2);}
  .modal .campo input,.modal .campo select{font-size:15px;min-height:44px;padding:0 12px;}
  .ajuda{margin:0;font-size:13px;color:var(--ink-3);font-weight:400;}
  .grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .grade4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px;}
  .caixa-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--campo);border-radius:8px;padding:6px 8px;min-height:44px;}
  .caixa-chips input{flex:1 1 160px;border:none;outline:none;font-size:15px;min-height:30px;}
  .chip-bairro{display:inline-flex;align-items:center;gap:4px;font-size:14px;background:var(--azul-suave);color:var(--azul-escuro);border-radius:6px;padding:4px 4px 4px 10px;}
  .chip-bairro button{background:none;border:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#164F8F;}
  .opcao{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--campo);border-radius:10px;padding:14px 16px;cursor:pointer;}
  .opcao.ativa{border:2px solid var(--azul);background:#F3F8FE;padding:13px 15px;}
  .opcao input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--azul);flex-shrink:0;}

  return 'direta';
}
function tipoCategoria(tipo) {
  const t = norm(tipo);
  if (t.includes('apart')) return 'Apartamento';
  if (t.includes('casa') || t.includes('sobrado')) return 'Casa';
  if (t.includes('terreno') || t.includes('lote') || t.includes('gleba')) return 'Terreno';
  return 'Comercial e outros';
}
function fatosTxt(f) {
  if (!f) return '';
  const p = [];
  if (f.tipo) p.push(f.tipo);
  if (f.quartos) p.push(f.quartos + (f.quartos === 1 ? ' quarto' : ' quartos'));
  if (f.vagas) p.push(f.vagas + (f.vagas === 1 ? ' vaga' : ' vagas'));
  if (f.area_privativa) p.push(Math.round(f.area_privativa) + ' m² privativos');
  else if (f.area_total) p.push(Math.round(f.area_total) + ' m² totais');
  return p.join(', ');
}
function imovelPorId(id) { return S.imoveis.find(x => x.id === id); }
function nomeBairro(im) { return im.bairro || 'Bairro não informado'; }

function visiveis() { return S.imoveis.filter(im => !im.ignorado); }
function passaMaisFiltros(im) {
  const mf = S.mf, f = im.fatos || {};
  if (mf.tipos.size && !mf.tipos.has(tipoCategoria(f.tipo))) return false;
  if (mf.quartos && !((Number(f.quartos) || 0) >= mf.quartos)) return false;
  const areaMin = parseBR(mf.area);
  if (areaMin && !((Number(f.area_privativa) || Number(f.area_total) || 0) >= areaMin)) return false;
  if (mf.desconto) { const d = descontoPct(im); if (d == null || d < mf.desconto) return false; }
  if (!mf.modalidades.has(grupoModalidade(im.modalidade))) return false;
  if (mf.financiamento && im.financiamento !== true) return false;
  return true;
}
function qtdMaisFiltros() {
  const mf = S.mf;
  return (mf.tipos.size ? 1 : 0) + (mf.quartos ? 1 : 0) + (parseBR(mf.area) ? 1 : 0) + (mf.desconto ? 1 : 0)
    + (mf.modalidades.size < 3 ? 1 : 0) + (mf.financiamento ? 1 : 0);
}
function baseDaAba() {
  if (S.aba === 'fav') return S.imoveis.filter(im => im.favorito && !im.ignorado);
  if (S.aba === 'sem') return S.imoveis.filter(im => im.ignorado);
  return visiveis();
}
function listaFiltrada(ignorarBairros) {
  const busca = norm(S.busca.trim());
  return baseDaAba().filter(im => {
    if (S.origem && !(im.filtros_correspondentes || []).includes(S.origem)) return false;
    if (busca) {
      const alvo = norm([im.endereco, im.bairro, im.cidade, im.empreendimento, im.numero_formatado, im.numero_imovel].join(' '));
      if (!alvo.includes(busca)) return false;
    }
    if (!ignorarBairros && S.bairros.size && !S.bairros.has(nomeBairro(im))) return false;
    if (S.aba !== 'sem' && !passaMaisFiltros(im)) return false;
    return true;
  });
}
function agendaProximos(dias = 7) {
  const itens = [];
  visiveis().forEach(im => {
    const sit = situacao(im);
    if (sit.atual && sit.atual.data) {
      const n = diasAte(sit.atual.data);
      if (n >= 0 && n < dias) itens.push({ im, praca: sit.atual });
    }
  });
  return itens.sort((a, b) => a.praca.data - b.praca.data);
}
function estatAlerta(f) {
  const ims = visiveis().filter(im => (im.filtros_correspondentes || []).includes(f.nome));
  const novos = ims.filter(im => ehRecente(im.primeira_vez_visto)).length;
  let prox = null;
  ims.forEach(im => { const s = situacao(im); if (s.atual && s.atual.data && (!prox || s.atual.data < prox)) prox = s.atual.data; });
  return { total: ims.length, novos, prox };
}
// =====================================================================
// Carregamento
// =====================================================================
async function carregarTudo() {
  const [rf, ri, rp, rc, rs] = await Promise.all([
    sb.from('filtros').select('*').order('criado_em', { ascending: false }),
    sb.from('meus_imoveis').select('*').order('atualizado_em', { ascending: false }).limit(3000),
    sb.from('perfil_usuario').select('*').maybeSingle(),
    sb.from('custo_imovel').select('*'),
    sb.from('status_execucao').select('*').order('executado_em', { ascending: false }).limit(12),
  ]);
  if (rf.error) console.error(rf.error);
  if (ri.error) console.error(ri.error);
  S.filtros = rf.data || [];
  S.imoveis = (ri.data || []).map(im => ({ ...im, filtros_correspondentes: im.filtros_correspondentes || [], fatos: im.fatos || {} }));
  S.perfil = rp.error ? null : (rp.data || null);
  S.custos = {};
  (rc.error ? [] : (rc.data || [])).forEach(c => { S.custos[c.imovel_id] = c; });
  S.status = rs.error ? [] : (rs.data || []);
  // não esconder falha de leitura: se uma tabela não carrega, o painel avisa qual
  S.erros = [];
  [['filtros', rf], ['imóveis', ri], ['perfil_usuario', rp], ['custo_imovel', rc], ['status_execucao', rs]].forEach(([nome, r]) => {
    if (r.error) { console.error('Erro ao ler ' + nome, r.error); S.erros.push(nome + ': ' + (r.error.message || r.error.code || 'erro')); }
  });
  const ids = new Set(S.imoveis.map(i => i.id));
  S.sel.forEach(id => { if (!ids.has(id)) S.sel.delete(id); });
  render();
}

// =====================================================================
// Renderização
// =====================================================================
function render() {
  renderStatus();
  ['alertas', 'imoveis', 'agenda'].forEach(v => $('view-' + v).classList.toggle('oculto', S.view !== v));
  document.querySelectorAll('[data-acao="ir"]').forEach(b => {
    if (b.classList.contains('marca')) return;
    if (b.dataset.view === S.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (S.view === 'alertas') renderAlertas();
  if (S.view === 'imoveis') renderImoveis();
  if (S.view === 'agenda') renderAgenda();
}

function renderStatus() {
  const el = $('status-topo'), faixa = $('faixa-status');
  const ok = S.status.find(s => s.status === 'ok' || s.status === 'parcial');
  let ultima = ok ? new Date(ok.executado_em) : null;
  if (!ultima && !S.status.length && S.imoveis.length) {
    ultima = new Date(Math.max.apply(null, S.imoveis.map(i => new Date(i.atualizado_em).getTime())));
  }
  const ultimoStatus = S.status[0];
  const falhaRecente = !!(ultimoStatus && ultimoStatus.status === 'falha' && (!ultima || new Date(ultimoStatus.executado_em) > ultima));
  const temDados = S.status.length > 0 || S.imoveis.length > 0;
  const atrasada = temDados && (falhaRecente || listaAtrasada(ultima));

  if (!ultima) { el.textContent = 'Ainda sem busca registrada.'; el.classList.toggle('alerta', atrasada); }
  else if (atrasada) { el.textContent = 'Última atualização: ' + hojeOuOntem(ultima); el.classList.add('alerta'); }
  else { el.textContent = 'Atualizado ' + hojeOuOntem(ultima) + '. Próxima busca ' + proximaBusca() + '.'; el.classList.remove('alerta'); }

  let faixas = '';
  if (S.erros && S.erros.length) {
    faixas += '<section class="faixa faixa-aviso" role="alert">' + ICONES.aviso + '<p><b>Parte dos dados não carregou.</b> ' + esc(S.erros.join(' | '))
      + '. Se a mensagem fala em "permission denied", falta liberar a tabela no Supabase (arquivo liberar_acesso.sql).</p></section>';
  }
  if (atrasada) {
    const desde = ultima ? ' desde ' + hojeOuOntem(ultima) : '';
    let texto;
    if (falhaRecente) {
      texto = 'A última busca falhou. A lista pode estar desatualizada' + desde + '. O sistema tenta de novo ' + proximaBusca() + '.';
    } else {
      const hPrev = new Date(buscaPrevistaAnterior(new Date()).getTime() - 3 * 3600000).getUTCHours();
      texto = 'A busca das ' + hPrev + 'h ainda não apareceu. A lista pode estar desatualizada' + desde
        + '. Se passar de mais algumas horas, avise o administrador do sistema.';
    }
    faixas += '<section class="faixa faixa-aviso" role="status">' + ICONES.aviso + '<p>' + esc(texto) + '</p></section>';
  }
  faixa.innerHTML = faixas;
}

// ---------------- Meus alertas ----------------

  const ativos = S.filtros.filter(f => f.ativo).length, pausados = S.filtros.length - ativos;
  const comAlerta = visiveis().filter(im => im.filtros_correspondentes.length);
  const novos = comAlerta.filter(im => ehRecente(im.primeira_vez_visto)).length;
  let h = '';
  if (!(S.perfil && S.perfil.telegram_chat_id) && localStorage.getItem('radar_ocultar_tg') !== '1') {
    h += '<section class="faixa faixa-info">' + ICONES.telegram
      + '<p>Receba no Telegram os imóveis novos, as mudanças de leilão e lembretes na véspera.</p>'
      + '<div style="display:flex;gap:8px"><button class="btn btn-pri" data-acao="abrir-notificacoes">Conectar Telegram</button>'
      + '<button class="btn btn-texto" data-acao="ocultar-tg">Agora não</button></div></section>';
  }
  const resumo = S.filtros.length
    ? ativos + (ativos === 1 ? ' alerta ativo' : ' alertas ativos') + (pausados ? ' e ' + pausados + ' pausado' + (pausados > 1 ? 's' : '') : '')
      + '. ' + comAlerta.length + (comAlerta.length === 1 ? ' imóvel encontrado' : ' imóveis encontrados')
      + (novos ? ', ' + novos + (novos === 1 ? ' novo' : ' novos') + ' nos últimos 2 dias.' : '.')
    : 'Crie um alerta e o sistema passa a buscar na lista oficial da Caixa 3 vezes por dia.';
  h += '<div class="cabeca-pag"><div><h1 class="titulo-pag">Meus alertas</h1><p class="sub-pag">' + esc(resumo) + '</p></div>'
    + '<button class="btn btn-pri btn-lg" data-acao="novo-alerta">' + ICONES.mais + 'Novo alerta</button></div>';
  if (!S.filtros.length) {
    h += '<div class="vazio"><h3>Nenhum alerta ainda</h3><p>Informe estado, cidade, bairros (opcional) e faixa de valor.</p></div>';
  } else {
    h += '<div class="grade-alertas">' + S.filtros.map(cardAlerta).join('') + '</div>';
  }
  $('view-alertas').innerHTML = h;
}

function cardAlerta(f) {
  const e = estatAlerta(f);
  const bairros = (f.bairros || []).length
    ? (f.bairros.length > 3 ? f.bairros.slice(0, 3).join(', ') + ' e mais ' + (f.bairros.length - 3) : f.bairros.join(', '))
    : 'Qualquer bairro';
  let num;
  if (f.ativo) {
    num = '<span style="font-weight:600">' + e.total + (e.total === 1 ? ' imóvel' : ' imóveis') + '</span>'
      + (e.novos ? '<span class="tag tag-novo">' + e.novos + (e.novos === 1 ? ' novo' : ' novos') + '</span>' : '');
    if (e.prox) {
      const rel = diasAte(e.prox);
      num += rel <= 1 ? '<span style="color:#8A3E00;font-weight:600">Leilão ' + (rel === 0 ? 'hoje' : 'amanhã') + '</span>'
        : '<span style="color:var(--ink-3)">Próximo leilão em ' + dataCurta(e.prox) + '</span>';
    }
  } else {
    num = '<span style="color:var(--ink-3)">Pausado. Não busca imóveis novos.'
      + (e.total ? ' ' + e.total + (e.total === 1 ? ' imóvel encontrado antes continua' : ' imóveis encontrados antes continuam') + ' na lista.' : '') + '</span>';
  }
  return '<article class="alerta' + (f.ativo ? '' : ' pausado') + '">'
    + '<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><h2>' + esc(f.nome) + '</h2>'
    + (f.ativo ? '<span class="tag tag-filtro">Ativo</span>' : '<span class="tag tag-pausado">Pausado</span>') + '</div>'
    + '<dl><dt>Local</dt><dd>' + esc(f.cidade) + ', ' + esc(f.estado) + '</dd><dt>Bairros</dt><dd>' + esc(bairros)
    + '</dd><dt>Avaliação</dt><dd>' + esc(faixaTxt(f.valor_min, f.valor_max)) + '</dd>'
    + (criteriosTxt(f.criterios) ? '<dt>Critérios</dt><dd>' + esc(criteriosTxt(f.criterios)) + '</dd>' : '') + '</dl>'
    + '<div class="alerta-num">' + num + '</div>'
    + '<div class="alerta-acoes"><button class="btn btn-texto" data-acao="ver-alerta" data-id="' + f.id + '">Ver imóveis</button><span style="flex:1"></span>'
    + '<button class="btn btn-sec" data-acao="editar-alerta" data-id="' + f.id + '">Editar</button>'
    + (f.ativo ? '<button class="btn btn-sec" data-acao="pausar-alerta" data-id="' + f.id + '">Pausar</button>'
      : '<button class="btn btn-sec" data-acao="retomar-alerta" data-id="' + f.id + '">Retomar</button>'
        + (e.total ? '<button class="btn btn-perigo" data-acao="excluir-resultados" data-id="' + f.id + '">Excluir resultados</button>' : ''))
    + '<button class="btn btn-sec btn-icone" data-acao="excluir-alerta" data-id="' + f.id + '" aria-label="Excluir alerta ' + esc(f.nome) + '" title="Excluir alerta">' + ICONES.lixeira + '</button>'
    + '</div></article>';
}

function chipsAtivos() {
  const mf = S.mf, c = [];
  const chip = (campo, texto) => '<button class="chip-x" data-acao="tirar-chip" data-campo="' + campo + '" aria-label="Remover filtro ' + esc(texto) + '">' + esc(texto) + ICONES.x + '</button>';
  if (S.origem) c.push(chip('origem', 'Alerta: ' + S.origem));
  if (S.bairros.size) c.push(chip('bairros', S.bairros.size === 1 ? [...S.bairros][0] : S.bairros.size + ' bairros'));
  if (mf.tipos.size) c.push(chip('tipos', [...mf.tipos].join(' ou ')));
  if (mf.quartos) c.push(chip('quartos', mf.quartos + '+ quartos'));
  if (parseBR(mf.area)) c.push(chip('area', 'Área a partir de ' + parseBR(mf.area) + ' m²'));
  if (mf.desconto) c.push(chip('desconto', 'Desconto a partir de ' + mf.desconto + '%'));
  if (mf.modalidades.size < 3) c.push(chip('modalidades', 'Modalidade: ' + [...mf.modalidades].map(m => ({ leilao: 'leilão', direta: 'venda direta', licitacao: 'licitação' })[m]).join(', ')));
  if (mf.financiamento) c.push(chip('financiamento', 'Aceita financiamento'));
  return c.join('');
}

function barraSelecao(modoSem) {
  const n = S.sel.size;
  const acoes = modoSem
    ? '<button class="btn btn-sec" data-acao="lote-restaurar">Restaurar selecionados</button>'
    : '<button class="btn btn-sec" data-acao="lote-fav">' + ICONES.estrela + 'Favoritar</button>'
      + '<button class="btn btn-sec" data-acao="lote-sem">' + ICONES.semInteresse + 'Sem interesse</button>'
      + '<button class="btn btn-sec" data-acao="lote-rem">' + ICONES.remover + 'Remover da lista</button>';
  return '<section class="barra-selecao" aria-label="Ações para os imóveis selecionados"><div class="linha">'
    + '<strong style="margin-right:8px">' + n + (n === 1 ? ' selecionado' : ' selecionados') + '</strong>' + acoes
    + '<span style="flex:1"></span><button class="btn btn-texto" data-acao="limpar-sel">Cancelar seleção</button></div>'
    + (modoSem ? '' : '<p>Remover da lista: some agora e só volta se o imóvel mudar de preço ou de praça. Sem interesse: não volta mais e fica na aba Sem interesse.</p>')
    + '</section>';
}

function ordenar(lista) {
  const v = im => situacao(im).valorAtual || 0;
  const l = [...lista];
  if (S.organizar === 'valor-asc') l.sort((a, b) => v(a) - v(b));
  else if (S.organizar === 'valor-desc') l.sort((a, b) => v(b) - v(a));
  else if (S.organizar === 'desconto') l.sort((a, b) => (descontoPct(b) || -999) - (descontoPct(a) || -999));
  else if (S.organizar === 'leilao') {
    const d = im => { const s = situacao(im); return s.atual && s.atual.data ? s.atual.data.getTime() : Infinity; };
    l.sort((a, b) => d(a) - d(b));
  }
  return l;
}

function renderLista(lista) {
  if (S.organizar !== 'bairro') return ordenar(lista).map(cardImovel).join('');
  const grupos = new Map();
  lista.forEach(im => { const b = nomeBairro(im); if (!grupos.has(b)) grupos.set(b, []); grupos.get(b).push(im); });
  return [...grupos.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR')).map(b => {
    const itens = grupos.get(b).sort((x, y) => (situacao(x).valorAtual || 0) - (situacao(y).valorAtual || 0));
    const todosSel = itens.every(i => S.sel.has(i.id));
    return '<div class="grupo-cab"><label><input type="checkbox" data-acao="sel-grupo" data-ids="' + itens.map(i => i.id).join(',') + '"'
      + (todosSel ? ' checked' : '') + ' aria-label="Selecionar os imóveis de ' + esc(b) + '">' + esc(b) + '</label><span>'
      + itens.length + (itens.length === 1 ? ' imóvel' : ' imóveis') + '</span></div>' + itens.map(cardImovel).join('');
  }).join('');
}

function cardImovel(im) {
  const sit = situacao(im), desc = descontoPct(im, sit), av = Number(im.valor_avaliacao);
  let sub = '';
  if (desc != null) {
    if (desc > 0.05) sub = pct(desc) + ' abaixo da avaliação de ' + brl(av);
    else if (desc < -0.05) sub = pct(-desc) + ' acima da avaliação de ' + brl(av);
    else sub = 'Igual à avaliação.';
    if (sit.atual && sit.atual.n === 1) {
      const p2 = sit.pracas.find(p => p.n === 2);
      if (p2 && av) sub += ' Se não vender, cai ' + pct((sit.atual.valor - p2.valor) / sit.atual.valor * 100) + ' no 2º leilão.';
    }
  }
  const tags = (ehRecente(im.primeira_vez_visto) ? '<span class="tag tag-novo">Novo</span>' : '')
    + (im.filtros_correspondentes || []).map(n => '<span class="tag tag-filtro">' + esc(n) + '</span>').join('')
    + (im.financiamento ? '<span class="tag tag-fin">Aceita financiamento</span>' : '');
  const endereco = (im.empreendimento ? im.empreendimento + ', ' : '') + (im.endereco || '');
  const num = im.numero_formatado || im.numero_imovel;
  let pracas = '';
  if (sit.tipo === 'leilao') {
    pracas = '<div class="pracas"><p class="mod">' + esc(im.modalidade || 'Leilão') + '</p><ol>' + sit.pracas.map(p => {
      const dataTxt = p.data ? dataCurta(p.data) + (p.hora ? ' às ' + p.hora : '') : 'data não informada';
      if (p.passou) return '<li class="praca passada"><div class="l1"><span>' + p.n + 'º leilão, ' + dataTxt + '</span><span>Encerrado</span></div><div class="l2">' + brl(p.valor) + '</div></li>';
      const ehAtual = sit.atual && sit.atual.n === p.n;
      const rel = ehAtual && p.data ? quandoRelativo(p.data) : null;
      const urg = rel && diasAte(p.data) <= 1;
      return '<li class="praca' + (ehAtual ? ' atual' : '') + (urg ? ' urgente' : '') + '"><div class="l1"><span>' + p.n + 'º leilão, ' + dataTxt + '</span>'
        + (rel ? '<span class="quando' + (urg ? ' urgente' : '') + '">' + rel + '</span>' : '') + '</div><div class="l2">' + brl(p.valor) + '</div></li>';
    }).join('') + '</ol></div>';
  } else if (im.modalidade) {
    pracas = '<p style="margin:0;padding:0 20px 16px;font-size:14px;color:var(--ink-2)">' + esc(im.modalidade) + ': sem data de leilão.</p>';
  }
  const custo = S.custos[im.id];
  const custoHtml = custo
    ? '<div class="custo-linha"><span>Custo real estimado: <strong>' + brl(custo.custo_total) + '</strong></span><button class="btn btn-texto" data-acao="calc" data-id="' + im.id + '">Ver cálculo</button></div>'
    : '';
  const ed = [['Matrícula', im.matricula], ['IPTU', im.inscricao_imobiliaria], ['Comarca', im.comarca], ['Edital', im.edital], ['Leiloeiro(a)', im.leiloeiro]].filter(x => x[1]);
  const edital = ed.length ? '<details class="im-edital"><summary>Dados do edital</summary><dl>' + ed.map(([r, v]) => '<div><dt>' + r + '</dt><dd>' + esc(v) + '</dd></div>').join('') + '</dl></details>' : '';
  const sel = S.sel.has(im.id);
  return '<article class="imovel' + (sel ? ' sel' : '') + (S.destaque === im.id ? ' destaque' : '') + '" id="im-' + im.id + '">'
    + '<div class="im-topo"><div class="im-chk"><input type="checkbox" data-acao="sel" data-id="' + im.id + '"' + (sel ? ' checked' : '') + ' aria-label="Selecionar ' + esc(nomeBairro(im)) + ', ' + esc(im.endereco) + '"></div>'
    + '<div class="im-info"><div class="tags">' + tags + '</div><h3>' + esc(nomeBairro(im)) + ', ' + esc(im.cidade) + ' (' + esc(im.uf) + ')</h3>'
    + '<p>' + esc(endereco) + '<a class="mapa" href="' + linkMapa(im) + '" target="_blank" rel="noopener">Ver no mapa</a></p>'
    + '<p class="fatos">' + esc(fatosTxt(im.fatos)) + (fatosTxt(im.fatos) ? '. ' : '') + 'Imóvel nº ' + esc(num) + '</p></div>'
    + '<div class="im-preco"><span class="rot">' + esc(sit.rotulo) + '</span><span class="valor">' + brl(sit.valorAtual) + '</span><span class="sub">' + esc(sub) + '</span></div></div>'
    + pracas + custoHtml + edital
    + '<div class="im-acoes">'
    + (im.favorito ? '<button class="btn btn-sec btn-fav-ativo" data-acao="fav" data-id="' + im.id + '" aria-pressed="true">' + ICONES.estrelaCheia + 'Favorito</button>'
      : '<button class="btn btn-sec" data-acao="fav" data-id="' + im.id + '" aria-pressed="false">' + ICONES.estrela + 'Favoritar</button>')
    + '<button class="btn btn-sec" data-acao="sem" data-id="' + im.id + '">' + ICONES.semInteresse + 'Sem interesse</button>'
    + (custo ? '' : '<button class="btn btn-sec" data-acao="calc" data-id="' + im.id + '">' + ICONES.calc + 'Custo real</button>')
    + '<span style="flex:1"></span>'
    + (im.link ? '<a class="btn btn-texto" href="' + esc(im.link) + '" target="_blank" rel="noopener">Abrir na Caixa' + ICONES.externo + '</a>' : '')
    + '</div></article>';
}

let toastTimer = null;
function toast(texto, desfazer) {
  const el = $('toast');
  el.innerHTML = '<span>' + esc(texto) + '</span>' + (desfazer ? '<button type="button" id="btn-desfazer">Desfazer</button>' : '');
  el.classList.remove('oculto');
  if (desfazer) $('btn-desfazer').onclick = async () => { el.classList.add('oculto'); await desfazer(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('oculto'), 7000);
}

// Ações sobre imóveis (favorito, sem interesse, remover da lista)
// =====================================================================
async function gravarInteresse(linhas) {
  // todas as linhas com as mesmas chaves (o upsert em lote exige isso)
  const { error } = await sb.from('interesse_usuario').upsert(linhas, { onConflict: 'user_id,imovel_id' });
  if (error) { toast('Não foi possível salvar: ' + error.message); return false; }
  return true;
}
async function marcarFavorito(ids, valor) {
  const antes = ids.map(id => ({ imovel_id: id, favorito: !!(imovelPorId(id) || {}).favorito }));
  if (!await gravarInteresse(ids.map(id => ({ imovel_id: id, favorito: valor })))) return;
  S.sel.clear();
  await carregarTudo();
  toast(valor ? (ids.length === 1 ? 'Adicionado aos favoritos.' : ids.length + ' imóveis favoritados.') : 'Removido dos favoritos.',
    async () => { await gravarInteresse(antes); await carregarTudo(); });
}
async function marcarSemInteresse(ids, valor) {
  const antes = ids.map(id => ({ imovel_id: id, ignorado: !!(imovelPorId(id) || {}).ignorado }));
  if (!await gravarInteresse(ids.map(id => ({ imovel_id: id, ignorado: valor })))) return;
  S.sel.clear();
  await carregarTudo();
  const n = ids.length;
  toast(valor ? (n === 1 ? 'Movido para Sem interesse.' : n + ' imóveis movidos para Sem interesse.') : (n === 1 ? 'Imóvel restaurado.' : n + ' imóveis restaurados.'),
    async () => { await gravarInteresse(antes); await carregarTudo(); });
}
async function removerDaLista(ids) {
  const linhas = ids.map(id => { const im = imovelPorId(id) || {}; return { imovel_id: id, removido: true, removido_preco: im.preco == null ? null : im.preco, removido_modalidade: im.modalidade || null }; });
  if (!await gravarInteresse(linhas)) return;
  S.sel.clear();
  await carregarTudo();
  toast(ids.length === 1 ? 'Removido da lista.' : ids.length + ' imóveis removidos da lista.',
    async () => { await gravarInteresse(ids.map(id => ({ imovel_id: id, removido: false, removido_preco: null, removido_modalidade: null }))); await carregarTudo(); });
}

let tgPoll = null;
function pararPollTelegram() { if (tgPoll) { clearInterval(tgPoll); tgPoll = null; } }
// enquanto a janela do Telegram está aberta e a conta não conectou, confere o banco
// a cada 3 s; quando a conexão aparece, a janela vira "Conectado" sozinha
function iniciarPollTelegram() {
  pararPollTelegram();
  const inicio = Date.now();
  tgPoll = setInterval(async () => {
    if (Date.now() - inicio > 10 * 60 * 1000 || $('modal-fundo').classList.contains('oculto')) { pararPollTelegram(); return; }
    const { data } = await sb.from('perfil_usuario').select('telegram_chat_id').maybeSingle();
    if (data && data.telegram_chat_id) {
      pararPollTelegram();
      await carregarTudo();
      abrirNotificacoes();
      toast('Telegram conectado.');
    }
  }, 3000);
}

function abrirModal(html, largo) {
  pararPollTelegram();
  const f = $('modal-fundo');
  f.innerHTML = '<div class="modal' + (largo ? ' largo' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  f.classList.remove('oculto');
  document.body.style.overflow = 'hidden';
  const foco = f.querySelector('input, select, button.btn-pri');
  if (foco) setTimeout(() => foco.focus(), 30);
}
function fecharModal() {
  pararPollTelegram();
  $('modal-fundo').classList.add('oculto');
  $('modal-fundo').innerHTML = '';
  document.body.style.overflow = '';
}

// ---------------- Formulário de alerta ----------------
let formAlerta = null;
const FAIXAS = [['Até 100 mil', 0, 100000], ['100 a 200 mil', 100000, 200000], ['200 a 400 mil', 200000, 400000],
  ['400 a 750 mil', 400000, 750000], ['Acima de 750 mil', 750000, null], ['Qualquer valor', 0, null]];
const MODALIDADES_TODAS = ['leilao', 'direta', 'licitacao'];
function critDoFiltro(c) {
  c = c || {};
  return { tipos: [...(c.tipos || [])], quartos: c.quartos || 0, desconto: c.desconto || 0,
    area: c.area ? String(c.area).replace('.', ',') : '',
    modalidades: (c.modalidades && c.modalidades.length) ? [...c.modalidades] : [...MODALIDADES_TODAS],
    financiamento: !!c.financiamento };
}
function critParaSalvar(c) {
  const o = {};
  if (c.tipos.length) o.tipos = c.tipos;
  if (c.quartos) o.quartos = c.quartos;
  if (c.desconto) o.desconto = c.desconto;
  const area = parseBR(c.area); if (area) o.area = area;
  if (c.modalidades.length && c.modalidades.length < 3) o.modalidades = c.modalidades;
  if (c.financiamento) o.financiamento = true;
  return Object.keys(o).length ? o : null;
}
// base (opcional, só pra alerta novo): { crit, filtro } — copia critérios e/ou local de outro alerta
function abrirFormAlerta(id, base) {
  const f = id ? S.filtros.find(x => x.id === id) : null;
  const src = f || (base && base.filtro) || null;
  const crit = base && base.crit ? base.crit : critDoFiltro(src ? src.criterios : null);
  formAlerta = { id: f ? f.id : null, estado: src ? src.estado : 'BA', cidade: src ? src.cidade : '', bairros: src ? [...(src.bairros || [])] : [],
    min: src ? (Number(src.valor_min) || 0) : 0, max: src ? (src.valor_max == null ? null : Number(src.valor_max)) : null,
    nome: f ? f.nome : '', nomeManual: !!f, crit, tinhaCrit: !!(f && f.criterios) };
  formAlerta.avancado = !!critParaSalvar(crit);
  desenharFormAlerta();
}
function htmlAvancado(a) {

  if (!a.avancado) {

    + '<div class="campo">Desconto mínimo sobre a avaliação' + seg('desconto', [[0, 'Qualquer'], [10, '10%'], [20, '20%'], [30, '30%'], [40, '40%']], c.desconto) + '</div>'
    + '<label class="campo">Área mínima (m²)<input id="fa-area" inputmode="numeric" value="' + esc(c.area) + '" placeholder="ex: 40" style="max-width:140px"></label>'
    + '<div class="campo">Modalidade' + [['leilao', 'Leilão (1º e 2º)'], ['direta', 'Venda direta'], ['licitacao', 'Licitação aberta']].map(([v, t]) =>

    + '<label class="marcar"><input type="checkbox" id="fa-fin"' + (c.financiamento ? ' checked' : '') + '>Só imóveis que aceitam financiamento</label></fieldset>';
}
function nomeSugerido() {
  const a = formAlerta;

    + '<input id="fa-bairro" placeholder="Digite um bairro e tecle Enter"></div><p class="ajuda">Deixe vazio para qualquer bairro da cidade.</p></div></fieldset>'

// ---------------- Pausar / excluir resultados / excluir alerta ----------------
function contarSaida(f) {
  const outrosAtivos = new Set(S.filtros.filter(x => x.ativo && x.id !== f.id).map(x => x.nome));
  const doAlerta = S.imoveis.filter(im => (im.filtros_correspondentes || []).includes(f.nome));
  const fav = doAlerta.filter(im => im.favorito);
  const sem = doAlerta.filter(im => im.ignorado && !im.favorito);
  const outro = doAlerta.filter(im => !im.favorito && !im.ignorado && im.filtros_correspondentes.some(n => outrosAtivos.has(n)));
  const saem = doAlerta.filter(im => !im.favorito && !im.ignorado && !im.filtros_correspondentes.some(n => outrosAtivos.has(n)));
  return { total: doAlerta.filter(im => !im.ignorado).length, fav, sem, outro, saem };
}

let calcAtual = null;
const CALC_CAMPOS = ['lance', 'comissao', 'itbi', 'registro', 'debitos', 'reforma', 'desocupacao', 'mercado', 'pctAluguel', 'aluguel'];
function calcular(d) {
  const lance = parseBR(d.lance) || 0;
  const comissao = lance * parsePct(d.comissao) / 100, itbi = lance * parsePct(d.itbi) / 100;
  const registro = parseBR(d.registro) || 0, debitos = parseBR(d.debitos) || 0, reforma = parseBR(d.reforma) || 0, desocupacao = parseBR(d.desocupacao) || 0;
  const total = lance + comissao + itbi + registro + debitos + reforma + desocupacao;
  const mercado = parseBR(d.mercado) || 0, ganho = mercado - total;
  const minimo = mercado * parsePct(d.pctAluguel) / 100, aluguel = parseBR(d.aluguel);

}

// código de uso único do QR Code: 32 caracteres aleatórios, vale 15 minutos e é apagado
// no instante em que a conexão é feita. O link nunca leva o identificador da conta.
function gerarCodigoVinculo() {
  const a = new Uint8Array(16);
  (window.crypto || globalThis.crypto).getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
async function prepararVinculo() {
  const codigo = gerarCodigoVinculo();
  const expira = new Date(Date.now() + 15 * 60 * 1000).toISOString();
  const { error } = await sb.from('perfil_usuario').upsert({ vinculo_token: codigo, vinculo_expira: expira }, { onConflict: 'user_id' });
  return error ? { erro: error.message } : { codigo };
}

}

document.addEventListener('click', async (e) => {
  const menu = $('menu-conta');
  if (menu && !menu.classList.contains('oculto') && !e.target.closest('.conta')) menu.classList.add('oculto');
  if (e.target.id === 'modal-fundo') { fecharModal(); return; }
  const el = e.target.closest('[data-acao]');
  if (!el) return;
  const a = el.dataset.acao, id = el.dataset.id;
  if (el.tagName === 'INPUT') return; // caixas de seleção são tratadas no 'change'
  switch (a) {
    case 'ir': irPara(el.dataset.view); break;
    case 'menu-conta': { const m = $('menu-conta'); m.classList.toggle('oculto'); $('btn-conta').setAttribute('aria-expanded', String(!m.classList.contains('oculto'))); break; }
    case 'sair': await sb.auth.signOut(); location.hash = ''; location.reload(); break;
    case 'ocultar-tg': localStorage.setItem('radar_ocultar_tg', '1'); render(); break;
    case 'abrir-notificacoes': abrirNotificacoes(); break;
    case 'fechar-modal': fecharModal(); break;
    // alertas
    case 'novo-alerta': abrirFormAlerta(null); break;
    case 'editar-alerta': abrirFormAlerta(id); break;
    case 'ver-alerta': { const f = S.filtros.find(x => x.id === id); limparFiltrosImoveis(); S.origem = f ? f.nome : ''; S.aba = 'todos'; irPara('imoveis'); break; }
    case 'pausar-alerta': abrirPausar(id, false); break;
    case 'excluir-resultados': abrirPausar(id, true); break;
    case 'retomar-alerta': { const r = await sb.from('filtros').update({ ativo: true }).eq('id', id); if (r.error) toast('Erro: ' + r.error.message); else { await carregarTudo(); toast('Alerta retomado. Os imóveis aparecem na próxima busca.'); } break; }
    case 'excluir-alerta': abrirExcluirAlerta(id); break;
    case 'excluir-confirmar': { const r = await sb.from('filtros').delete().eq('id', id); if (r.error) { toast('Erro ao excluir: ' + r.error.message); return; } fecharModal(); await carregarTudo(); toast('Alerta excluído.'); break; }
    case 'pausa-confirmar': await confirmarPausa(); break;
    // formulário de alerta
    case 'fa-faixa': { lerFormAlerta(); const fx = FAIXAS[Number(el.dataset.i)]; formAlerta.min = fx[1]; formAlerta.max = fx[2]; desenharFormAlerta(); break; }
    case 'fa-tirar-bairro': lerFormAlerta(); formAlerta.bairros.splice(Number(el.dataset.i), 1); desenharFormAlerta(); break;
    case 'fa-salvar': await salvarFormAlerta(); break;
    case 'fa-avancado': lerFormAlerta(); formAlerta.avancado = true; desenharFormAlerta(); break;
    case 'fa-crit': {
      lerFormAlerta();
      const g = el.dataset.grupo, v = el.dataset.valor, c = formAlerta.crit;
      if (g === 'tipo') { const i = c.tipos.indexOf(v); i >= 0 ? c.tipos.splice(i, 1) : c.tipos.push(v); }
      else c[g] = Number(v);
      desenharFormAlerta(); break;
    }
    case 'mf-salvar-alerta': {
      const mf = S.mf;
      const crit = { tipos: [...mf.tipos], quartos: mf.quartos, desconto: mf.desconto, area: mf.area, modalidades: [...mf.modalidades], financiamento: mf.financiamento };
      abrirFormAlerta(null, { crit, filtro: S.filtros.find(x => x.nome === S.origem) || null });
      break;
    }
    // imóveis
    case 'aba': S.aba = el.dataset.aba; S.sel.clear(); S.destaque = null; render(); break;
    case 'mais-filtros': S.mfAberto = !S.mfAberto; render(); break;
    case 'mf': {
      const g = el.dataset.grupo, v = el.dataset.valor;
      if (g === 'tipo') { S.mf.tipos.has(v) ? S.mf.tipos.delete(v) : S.mf.tipos.add(v); }
      else S.mf[g] = Number(v);
      render(); break;
    }
    case 'limpar-mf': S.mf = { tipos: new Set(), quartos: 0, desconto: 0, area: '', modalidades: new Set(['leilao', 'direta', 'licitacao']), financiamento: false }; render(); break;
    case 'limpar-tudo': limparFiltrosImoveis(); render(); break;
    case 'tirar-chip': {
      const c = el.dataset.campo;
      if (c === 'origem') S.origem = ''; else if (c === 'bairros') S.bairros.clear();
      else if (c === 'tipos') S.mf.tipos.clear(); else if (c === 'area') S.mf.area = '';
      else if (c === 'modalidades') S.mf.modalidades = new Set(['leilao', 'direta', 'licitacao']);
      else if (c === 'financiamento') S.mf.financiamento = false; else S.mf[c] = 0;
      render(); break;
    }
    case 'limpar-bairros': S.bairros.clear(); render(); break;
    case 'fechar-bairros': { const d = $('det-bairros'); if (d) d.removeAttribute('open'); break; }
    case 'limpar-sel': S.sel.clear(); render(); break;
    case 'fav': { const im = imovelPorId(id); await marcarFavorito([id], !(im && im.favorito)); break; }
    case 'sem': await marcarSemInteresse([id], true); break;
    case 'restaurar': await marcarSemInteresse([id], false); break;
    case 'lote-fav': await marcarFavorito([...S.sel], true); break;
    case 'lote-sem': await marcarSemInteresse([...S.sel], true); break;
    case 'lote-rem': await removerDaLista([...S.sel]); break;
    case 'lote-restaurar': await marcarSemInteresse([...S.sel], false); break;
    case 'ir-imovel': irParaImovel(id); break;
    // calculadora
    case 'calc': abrirCalc(id); break;
    case 'calc-salvar': await salvarCalc(); break;
    case 'calc-apagar': await apagarCalc(); break;
    // telegram
    case 'tg-desconectar': await salvarPerfil({ telegram_chat_id: null }, 'Telegram desconectado.'); fecharModal(); break;
    case 'tg-manual': { const v = $('tg-manual').value.trim(); if (!v) return; if (await salvarPerfil({ telegram_chat_id: v }, 'Telegram conectado.')) fecharModal(); break; }
    case 'pf-salvar': {
      const vesp = $('pf-vesp').checked ? $('pf-vesp-modo').value : 'nao';
      const formato = (document.querySelector('input[name="formato"]:checked') || {}).value === 'resumo' ? 'resumo' : 'individual';
      if (await salvarPerfil({ avisar_novo: $('pf-novo').checked, avisar_mudanca: $('pf-mud').checked, lembrete_vespera: vesp, formato_aviso: formato }, 'Preferências salvas.')) fecharModal();
      break;
    }
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.acao === 'sel') { t.checked ? S.sel.add(t.dataset.id) : S.sel.delete(t.dataset.id); render(); return; }
  if (t.dataset.acao === 'sel-grupo') { t.dataset.ids.split(',').forEach(id => t.checked ? S.sel.add(id) : S.sel.delete(id)); render(); return; }
  if (t.dataset.acao === 'pf-formato') {
    document.querySelectorAll('.modal .opcao').forEach(o => o.classList.toggle('ativa', o.querySelector('input').checked));
    return;
  }
  if (t.dataset.acao === 'pausa-modo') {
    pausaModo.excluir = t.value === 'excluir';
    document.querySelectorAll('.opcao').forEach(o => o.classList.toggle('ativa', o.querySelector('input').checked));
    $('pausa-saem').style.display = pausaModo.excluir ? '' : 'none';
    $('pausa-btn').textContent = pausaModo.excluir ? 'Pausar e excluir ' + pausaModo.saem : 'Pausar alerta';
    return;
  }
  if (t.dataset.bairro !== undefined) { t.checked ? S.bairros.add(t.dataset.bairro) : S.bairros.delete(t.dataset.bairro); render(); const d = $('det-bairros'); if (d) d.setAttribute('open', ''); return; }
  if (t.dataset.mfMod) { t.checked ? S.mf.modalidades.add(t.dataset.mfMod) : S.mf.modalidades.delete(t.dataset.mfMod); render(); return; }
  if (t.id === 'mf-fin') { S.mf.financiamento = t.checked; render(); return; }
  if (t.id === 'sel-origem') { S.origem = t.value; render(); return; }
  if (t.id === 'sel-organizar') { S.organizar = t.value; render(); return; }
  if (t.id === 'fa-estado') { lerFormAlerta(); desenharFormAlerta(); return; }
  if (t.id === 'fa-min' || t.id === 'fa-max') {
    const v = parseBR(t.value); t.value = v == null ? '' : numBR(v);
    lerFormAlerta(); if (!formAlerta.nomeManual) { $('fa-nome').value = nomeSugerido(); }
    document.querySelectorAll('[data-acao="fa-faixa"]').forEach(b => { const fx = FAIXAS[Number(b.dataset.i)]; b.setAttribute('aria-pressed', String(fx[1] === formAlerta.min && fx[2] === formAlerta.max)); });
  }
  if (t.dataset.faMod) {
    const c = formAlerta.crit, v = t.dataset.faMod;
    c.modalidades = MODALIDADES_TODAS.filter(m => m === v ? t.checked : c.modalidades.includes(m));
    return;
  }
  if (t.id === 'fa-fin') { formAlerta.crit.financiamento = t.checked; return; }
  if (t.id === 'fa-area') { formAlerta.crit.area = t.value; return; }
  if (t.id === 'fa-cidade') { lerFormAlerta(); if (!formAlerta.nomeManual) $('fa-nome').value = nomeSugerido(); }
  if (t.dataset.calc) { const v = parseBR(t.value); if (!['comissao', 'itbi', 'pctAluguel'].includes(t.dataset.calc) && v != null) t.value = numBR(v); calcAtual.d[t.dataset.calc] = t.value; atualizarCalc(); }
});

let buscaTimer = null;
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'busca') {
    S.busca = t.value; clearTimeout(buscaTimer);
    buscaTimer = setTimeout(() => { const pos = t.selectionStart; render(); const b = $('busca'); if (b) { b.focus(); b.setSelectionRange(pos, pos); } }, 250);
  }
  if (t.id === 'mf-area') {
    S.mf.area = t.value; clearTimeout(buscaTimer);
    buscaTimer = setTimeout(() => { render(); const b = $('mf-area'); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } }, 400);
  }
  if (t.dataset && t.dataset.calc) { calcAtual.d[t.dataset.calc] = t.value; atualizarCalc(); }
  if (t.id === 'fa-nome') formAlerta.nomeManual = true;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('modal-fundo').classList.contains('oculto')) fecharModal();
  if (e.target.id === 'fa-bairro' && (e.key === 'Enter' || e.key === ',')) { e.preventDefault(); addBairro(); }
  if ((e.target.id === 'input-email' || e.target.id === 'input-senha') && e.key === 'Enter') tentarLogin();
});

// links vindos do Telegram: #imovel=<id> abre o imóvel; #calc=<id> abre a calculadora
function tratarLink() {
  const m = location.hash.match(/^#(imovel|calc)=([0-9a-f-]{36})$/i);
  if (!m) return;
  irParaImovel(m[2]);
  if (m[1] === 'calc') abrirCalc(m[2]);
  history.replaceState(null, '', location.pathname + location.search);
}
window.addEventListener('hashchange', () => { if (S.user) tratarLink(); });

// =====================================================================
// Login
// =====================================================================
function garantirCliente() {
  if (!sb) sb = supabase.createClient(SUPABASE_URL_FIXO, SUPABASE_ANON_KEY_FIXO, { auth: { persistSession: true, autoRefreshToken: true } });
  return sb;
}
function mostrarLogin(msg) {
  $('app').classList.add('oculto');
  $('login-screen').classList.remove('oculto');
  $('btn-entrar').disabled = false; $('btn-entrar').textContent = 'Entrar';
  const er = $('login-erro');
  if (msg) { er.textContent = msg; er.style.display = 'block'; } else er.style.display = 'none';
}
async function mostrarApp(user) {
  S.user = user; S.email = user.email || '';
  const nome = NOMES_USUARIOS[S.email] || S.email;
  $('btn-entrar').disabled = true; $('btn-entrar').textContent = 'Entrando...';
  await carregarTudo();
  $('nome-conta').textContent = nome.split(' ')[0];
  $('avatar').textContent = nome.split(/[\s@.]+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
  $('btn-conta').setAttribute('aria-label', 'Menu da conta de ' + nome);
  $('login-screen').classList.add('oculto');
  $('app').classList.remove('oculto');
  tratarLink();
}
async function tentarLogin() {
  const c = garantirCliente();
  const email = $('input-email').value.trim(), senha = $('input-senha').value;
  $('btn-entrar').disabled = true; $('btn-entrar').textContent = 'Entrando...';
  const { data, error } = await c.auth.signInWithPassword({ email, password: senha });
  if (error) { mostrarLogin('Não foi possível entrar: ' + error.message); return; }
  await mostrarApp(data.user);
}
$('btn-entrar').addEventListener('click', tentarLogin);
$('btn-mostrar-senha').innerHTML = SVG_OLHO_FECHADO;
$('btn-mostrar-senha').addEventListener('click', () => {
  const campo = $('input-senha'), b = $('btn-mostrar-senha'), mostrando = campo.type === 'text';
  campo.type = mostrando ? 'password' : 'text';
  b.title = mostrando ? 'Mostrar senha' : 'Esconder senha';
  b.setAttribute('aria-label', b.title);
  b.innerHTML = mostrando ? SVG_OLHO_FECHADO : SVG_OLHO_ABERTO;
});
(async () => {
  const c = garantirCliente();
  const { data } = await c.auth.getSession();
  if (data && data.session) await mostrarApp(data.session.user);
})();
</script>

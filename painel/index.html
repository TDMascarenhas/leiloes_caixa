<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Leilões — Caixa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#1c60ab; --azul-escuro:#0d3866; --azul-suave:#e9f1fa;
    --laranja:#ef9c00; --laranja-escuro:#c97e00;
    --bg:#f1f4f8; --card:#fff; --line:#dbe2ea; --ink:#122437; --ink-soft:#5b6b7c;
    --red:#c0392b; --red-bg:#fbeae8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Inter',sans-serif;font-weight:800;letter-spacing:-0.01em;margin:0;}

  /* ---- aviso de prévia ---- */
  /* ---- login ---- */
  #login-screen{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--azul);}
  #login-screen.oculto{display:none;}
  .login-card{width:100%;max-width:340px;padding:32px;background:#fff;border-radius:8px;border-top:4px solid var(--laranja);box-shadow:0 10px 30px rgba(0,0,0,.2);}
  .login-card h2{font-size:22px;color:var(--azul-escuro);margin-bottom:4px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
  .login-card label{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 4px;}
  .login-card input{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-bottom:14px;}
  .login-card button{width:100%;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:11px;border-radius:6px;border:none;background:var(--laranja);color:#fff;cursor:pointer;}
  .login-card button:hover{background:var(--laranja-escuro);}
  #login-erro{color:var(--red);font-size:13px;margin-top:12px;display:none;}

  /* ---- app ---- */
  #app{display:none;}
  #app.ativo{display:block;}
  header.top{background:var(--azul);border-bottom:4px solid var(--laranja);padding:22px 32px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  header.top h1{font-size:22px;color:#fff;}
  header.top p{margin:4px 0 0;color:#cfe1f4;font-size:13px;}
  .usuario-topo{display:flex;align-items:center;gap:10px;font-size:13px;color:#cfe1f4;}
  .btn-sair{font-size:13px;font-weight:700;padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.4);background:transparent;color:#fff;cursor:pointer;}

  nav.tabs{display:flex;gap:4px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--card);}
  nav.tabs button{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;padding:14px 6px;margin-right:24px;border:none;background:none;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;}
  nav.tabs button.active{color:var(--azul);border-bottom-color:var(--laranja);}

  main{max-width:960px;margin:0 auto;padding:28px 32px 80px;}
  section.view{display:none;}
  section.view.active{display:block;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;box-shadow:0 1px 2px rgba(18,36,55,.05);}

  /* ---- filtros ---- */
  form#form-filtro{display:grid;grid-template-columns:1.3fr 0.6fr 1.1fr 1.4fr 0.8fr 0.8fr auto;gap:12px;align-items:end;margin-bottom:26px;}
  form#form-filtro label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  form#form-filtro input, form#form-filtro select{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  form#form-filtro button{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:10px 14px;border-radius:6px;border:none;background:var(--laranja);color:#fff;cursor:pointer;white-space:nowrap;}
  form#form-filtro button:hover{background:var(--laranja-escuro);}

  .lista-filtros{display:flex;flex-direction:column;gap:10px;}
  .filtro-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-left:3px solid var(--azul);}
  .filtro-item.inativo{opacity:0.5;border-left-color:var(--line);}
  .filtro-info b{font-size:15px;color:var(--azul-escuro);}
  .filtro-info .meta{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .filtro-acoes{display:flex;gap:8px;flex-shrink:0;}
  .filtro-acoes button{font-family:'Inter',sans-serif;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;}
  .filtro-acoes button.excluir{color:var(--red);border-color:var(--red-bg);}
  .filtro-acoes button.excluir:hover{background:var(--red-bg);}

  /* ---- resultados / favoritos ---- */
  .barra-topo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .barra-topo input, .barra-topo select{font-family:'Inter',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .barra-topo input{flex:1;min-width:160px;}
  .contagem{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}

  .bairro-filtro{position:relative;}
  .bairro-filtro summary{list-style:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;white-space:nowrap;}
  .bairro-filtro summary::-webkit-details-marker{display:none;}
  .bairro-filtro summary::after{content:' ▾';color:var(--azul);}
  .bairro-filtro[open] summary::after{content:' ▴';}
  .bairro-filtro-painel{position:absolute;z-index:5;top:calc(100% + 4px);left:0;min-width:380px;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 6px 18px rgba(18,36,55,.12);}
  .bairro-filtro-acoes{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .bairro-filtro-acoes button{background:none;border:none;color:var(--azul);font-weight:700;font-size:12px;cursor:pointer;padding:0;}
  #bairro-filtro-lista{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;}
  .bairro-filtro-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 2px;white-space:nowrap;overflow:hidden;}
  .bairro-filtro-item span.contagem{color:var(--ink-soft);margin-left:auto;}

  .grupo-bairro{margin-bottom:22px;}
  .grupo-bairro-titulo{font-size:15px;font-weight:700;color:var(--azul-escuro);margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--azul-suave);display:flex;justify-content:space-between;}
  .grupo-bairro-titulo span.n{font-weight:400;font-size:13px;color:var(--ink-soft);}

  .imovel{padding:18px 20px;border-top:3px solid var(--azul);margin-bottom:14px;}
  .imovel-topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .imovel-numero{font-size:12px;font-family:ui-monospace,monospace;color:var(--ink-soft);margin-bottom:3px;}
  .badges-filtro{margin-bottom:6px;}
  .imovel-local{font-size:16px;font-weight:700;color:var(--azul-escuro);}
  .imovel-endereco{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .link-maps{margin-left:8px;font-size:12px;color:var(--azul);font-weight:600;text-decoration:none;white-space:nowrap;}
  .link-maps:hover{color:var(--laranja-escuro);}
  .imovel-valor{display:flex;flex-direction:column;align-items:flex-end;font-size:20px;font-weight:800;color:var(--azul);white-space:nowrap;}
  .rotulo-valor{font-size:10px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;}
  .chip{display:inline-block;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:20px;color:var(--ink-soft);margin-right:6px;margin-top:8px;background:#fff;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--azul-suave);color:var(--azul);margin-right:6px;}
  .badge.novo{background:var(--laranja);color:#fff;}
  .situacoes{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;}
  .situacao-item{display:flex;justify-content:space-between;gap:14px;align-items:baseline;font-size:13px;}
  .situacao-item.passado{text-decoration:line-through;color:var(--ink-soft);opacity:0.65;}
  .situacao-cabecalho{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px;}
  .situacao-valor{font-weight:700;color:var(--azul-escuro);text-align:right;white-space:nowrap;}
  .extras{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--ink-soft);}
  .linha-extra span:first-child{font-weight:600;color:var(--ink);margin-right:4px;}
  .imovel-rodape{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;}
  .imovel-rodape a{color:var(--azul);font-weight:700;text-decoration:none;}
  .imovel-rodape a:hover{text-decoration:underline;color:var(--laranja-escuro);}
  .btn-favorito{background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--line);padding:2px 4px;}
  .btn-favorito.ativo{color:var(--laranja);}
  .vazio{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .vazio h3{color:var(--ink);margin-bottom:6px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2>Radar de Leilões — Caixa</h2>
    <p class="sub">Conecte ao projeto e entre com seu login.</p>
    <label>URL do projeto Supabase</label>
    <input id="input-url" placeholder="https://xxxxx.supabase.co">
    <label>Chave anon (pública)</label>
    <input id="input-key" placeholder="chave anon" type="password">
    <label>E-mail</label>
    <input id="input-email" type="email" placeholder="voce@exemplo.com">
    <label>Senha</label>
    <input id="input-senha" type="password" placeholder="••••••••">
    <button id="btn-entrar">Entrar</button>
    <div id="login-erro"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1>Radar de Leilões — Caixa</h1>
      <p>Filtros salvos verificam a lista oficial da Caixa todo dia.</p>
    </div>
    <div class="usuario-topo">
      <span id="usuario-logado"></span>
      <button class="btn-sair" id="btn-sair">Sair</button>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="filtros" class="active">Filtros</button>
    <button data-tab="resultados">Resultados</button>
    <button data-tab="favoritos">Favoritos</button>
  </nav>

  <main>

    <section class="view active" id="view-filtros">
      <form id="form-filtro">
        <div><label>Nome do alerta</label><input id="f-nome" placeholder="ex: Salvador 400-750k" required></div>
        <div><label>Estado</label>
          <select id="f-estado" required>
            <option value="">UF</option>
            <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
            <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
            <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
            <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
            <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
            <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
            <option>SP</option><option>SE</option><option>TO</option>
          </select>
        </div>
        <div><label>Cidade</label><input id="f-cidade" placeholder="ex: Salvador" required></div>
        <div><label>Bairros (vírgula — vazio = qualquer um)</label><input id="f-bairros" placeholder="ex: Pituba, Rio Vermelho"></div>
        <div><label>Valor mín.</label><input id="f-valor-min" type="number" placeholder="0"></div>
        <div><label>Valor máx.</label><input id="f-valor-max" type="number" placeholder="sem limite"></div>
        <button type="submit">Adicionar alerta</button>
      </form>
      <div class="lista-filtros" id="lista-filtros"></div>
    </section>

    <section class="view" id="view-resultados">
      <div class="barra-topo">
        <input id="busca" placeholder="Buscar por endereço, bairro, cidade...">
        <select id="filtro-origem"><option value="">Todos os filtros</option></select>
        <details class="bairro-filtro" id="bairro-filtro">
          <summary id="bairro-filtro-resumo">Todos os bairros</summary>
          <div class="bairro-filtro-painel">
            <div class="bairro-filtro-acoes">
              <button type="button" onclick="limparSelecaoBairros()">Limpar seleção</button>
              <button type="button" onclick="document.getElementById('bairro-filtro').removeAttribute('open')">Fechar</button>
            </div>
            <div id="bairro-filtro-lista"></div>
          </div>
        </details>
        <select id="ordenar">
          <option value="bairro">Agrupar por bairro</option>
          <option value="valor-asc">Valor crescente</option>
          <option value="valor-desc">Valor decrescente</option>
        </select>
      </div>
      <div class="contagem" id="contagem"></div>
      <div id="grid-resultados"></div>
    </section>

    <section class="view" id="view-favoritos">
      <div class="contagem" id="contagem-favoritos"></div>
      <div id="grid-favoritos"></div>
    </section>

  </main>
</div>

<script>
// ---------------- conexão e login (Supabase Auth) ----------------
let sb = null;

function mostrarApp(email){
  document.getElementById('login-screen').classList.add('oculto');
  document.getElementById('app').classList.add('ativo');
  document.getElementById('usuario-logado').textContent = 'Olá, ' + (email || '');
  iniciarApp();
}

function mostrarLogin(mensagemErro){
  document.getElementById('app').classList.remove('ativo');
  document.getElementById('login-screen').classList.remove('oculto');
  const erro = document.getElementById('login-erro');
  if(mensagemErro){ erro.textContent = mensagemErro; erro.style.display = 'block'; }
  else { erro.style.display = 'none'; }
}

function garantirCliente(){
  const url = document.getElementById('input-url').value.trim();
  const key = document.getElementById('input-key').value.trim();
  if(!url || !key) return null;
  if(!sb){
    sb = supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
    localStorage.setItem('radar_caixa_url', url);
    localStorage.setItem('radar_caixa_key', key);
  }
  return sb;
}

async function tentarLogin(){
  const cliente = garantirCliente();
  if(!cliente){ mostrarLogin('Preencha a URL e a chave anon do Supabase.'); return; }
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  const { error } = await cliente.auth.signInWithPassword({ email, password: senha });
  if(error){ mostrarLogin('Não foi possível entrar: ' + error.message); return; }
  mostrarApp(email);
}

document.getElementById('btn-entrar').addEventListener('click', tentarLogin);
['input-email', 'input-senha'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') tentarLogin();
  });
});
document.getElementById('btn-sair').addEventListener('click', async () => {
  if(sb) await sb.auth.signOut();
  mostrarLogin();
});

// restaura URL/chave salvas e, se já houver sessão válida, entra direto
window.addEventListener('DOMContentLoaded', async () => {
  const url = localStorage.getItem('radar_caixa_url');
  const key = localStorage.getItem('radar_caixa_key');
  if(!url || !key) return;
  document.getElementById('input-url').value = url;
  document.getElementById('input-key').value = key;
  const cliente = garantirCliente();
  const { data } = await cliente.auth.getSession();
  if(data && data.session){
    mostrarApp(data.session.user.email);
  }
});

// ---------------- dados ----------------
let filtrosCache = [];
let resultadosCache = [];

async function carregarFiltros(){
  const { data, error } = await sb.from('filtros').select('*').order('criado_em', { ascending: false });
  if(error){ console.error(error); return; }
  filtrosCache = data || [];
  renderFiltros();
  preencherSelectOrigem();
}

async function carregarResultados(){
  const { data, error } = await sb.from('imoveis').select('*').order('atualizado_em', { ascending: false }).limit(500);
  if(error){ console.error(error); return; }
  resultadosCache = (data || []).map(mapearImovelDoBanco);
  renderResultados();
  renderFavoritos();
}

function mapearImovelDoBanco(row){
  return {
    id: row.id,
    numero_imovel: row.numero_formatado || row.numero_imovel,
    uf: row.uf, cidade: row.cidade, bairro: row.bairro || 'Bairro não informado',
    endereco: row.endereco, valor_avaliacao: row.valor_avaliacao,
    fatos: row.fatos || {},
    modalidade: row.modalidade, preco: row.preco,
    valor_1_leilao: row.valor_1_leilao, data_1_leilao: row.data_1_leilao,
    valor_2_leilao: row.valor_2_leilao, data_2_leilao: row.data_2_leilao,
    matricula: row.matricula, iptu: row.inscricao_imobiliaria,
    comarca: row.comarca, edital: row.edital, leiloeiro: row.leiloeiro,
    link: row.link, foto_url: row.foto_url,
    filtros_correspondentes: row.filtros_correspondentes || [],
    criado_em: row.primeira_vez_visto,
    favorito: !!row.favorito,
  };
}

function montarSituacoes(im){
  const temLeiloes = im.valor_1_leilao != null || im.valor_2_leilao != null;
  if(temLeiloes){
    const lista = [{ modalidade: im.modalidade || 'Situação atual', cabecalho: true }];
    if(im.valor_1_leilao != null) lista.push({ modalidade: '1º Leilão', valor: im.valor_1_leilao, data: im.data_1_leilao });
    if(im.valor_2_leilao != null) lista.push({ modalidade: '2º Leilão', valor: im.valor_2_leilao, data: im.data_2_leilao });
    return lista;
  }
  return [{ modalidade: im.modalidade || 'Situação atual', valor: im.preco, data: null }];
}

function ehRecente(dataISO) {
  if(!dataISO) return false;
  const dias = (Date.now() - new Date(dataISO).getTime()) / 86400000;
  return dias <= 2;
}
function formatarValor(v) {
  if (v === null || v === undefined) return '-';
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function parseDataBr(str) {
  if (!str) return null;
  const m = str.match(/(\d{2})\/(\d{2})\/(\d{4})(?:[^\d]*(\d{1,2})[h:](\d{2}))?/);
  if (!m) return null;
  const [, d, mo, y, h, mi] = m;
  return new Date(Number(y), Number(mo) - 1, Number(d), h ? Number(h) : 23, mi ? Number(mi) : 59);
}
function leilaoPassou(dataStr) {
  const d = parseDataBr(dataStr);
  return d ? d.getTime() < Date.now() : false;
}
function linkMapa(im) {
  const q = encodeURIComponent(`${im.endereco || ''}, ${im.bairro || ''}, ${im.cidade} - ${im.uf}`);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

// ---------------- filtros ----------------
function renderFiltros() {
  const container = document.getElementById('lista-filtros');
  if (filtrosCache.length === 0) {
    container.innerHTML = '<div class="vazio"><h3>Nenhum alerta cadastrado</h3><p>Crie um acima.</p></div>';
    return;
  }
  container.innerHTML = filtrosCache.map(f => {
    const bairros = (f.bairros && f.bairros.length) ? f.bairros.join(', ') : 'qualquer bairro';
    const max = f.valor_max ? formatarValor(f.valor_max) : 'sem limite';
    return `<div class="card filtro-item ${f.ativo ? '' : 'inativo'}">
      <div class="filtro-info">
        <b>${f.nome}</b>
        <div class="meta">${f.cidade}/${f.estado} — ${bairros} — de ${formatarValor(f.valor_min || 0)} até ${max}</div>
      </div>
      <div class="filtro-acoes">
        <button onclick="alternarAtivo('${f.id}')">${f.ativo ? 'Pausar' : 'Ativar'}</button>
        <button class="excluir" onclick="excluirFiltro('${f.id}')">Excluir</button>
      </div>
    </div>`;
  }).join('');
}
async function alternarAtivo(id) {
  const f = filtrosCache.find(x => x.id === id);
  if (!f) return;
  const { error } = await sb.from('filtros').update({ ativo: !f.ativo }).eq('id', id);
  if(error){ alert('Erro ao atualizar: ' + error.message); return; }
  carregarFiltros();
}
async function excluirFiltro(id) {
  if(!confirm('Excluir este alerta? Os imóveis já encontrados por ele continuam salvos.')) return;
  const { error } = await sb.from('filtros').delete().eq('id', id);
  if(error){ alert('Erro ao excluir: ' + error.message); return; }
  carregarFiltros();
}
document.getElementById('form-filtro').addEventListener('submit', async e => {
  e.preventDefault();
  const bairros = document.getElementById('f-bairros').value.split(',').map(b => b.trim()).filter(Boolean);
  const payload = {
    nome: document.getElementById('f-nome').value.trim() || 'Novo alerta',
    estado: document.getElementById('f-estado').value || 'BA',
    cidade: document.getElementById('f-cidade').value.trim() || 'Salvador',
    bairros,
    valor_min: Number(document.getElementById('f-valor-min').value) || 0,
    valor_max: document.getElementById('f-valor-max').value ? Number(document.getElementById('f-valor-max').value) : null,
    ativo: true,
  };
  const { error } = await sb.from('filtros').insert(payload);
  if(error){ alert('Erro ao salvar: ' + error.message); return; }
  e.target.reset();
  carregarFiltros();
});
function preencherSelectOrigem() {
  const select = document.getElementById('filtro-origem');
  const atual = select.value;
  const nomes = [...new Set(filtrosCache.map(f => f.nome))];
  select.innerHTML = '<option value="">Todos os filtros</option>' + nomes.map(n => `<option value="${n}">${n}</option>`).join('');
  select.value = atual;
}

// ---------------- cards (resultados / favoritos) ----------------
function chipsFatos(f) {
  if (!f) return '';
  const itens = [];
  if (f.tipo) itens.push(f.tipo);
  if (f.quartos) itens.push(f.quartos + (f.quartos === 1 ? ' quarto' : ' quartos'));
  if (f.banheiros) itens.push(f.banheiros + (f.banheiros === 1 ? ' banheiro' : ' banheiros'));
  if (f.vagas) itens.push(f.vagas + (f.vagas === 1 ? ' vaga' : ' vagas'));
  if (f.area_privativa) itens.push(Math.round(f.area_privativa) + ' m² privativos');
  (f.amenidades || []).forEach(a => itens.push(a));
  return itens.map(t => `<span class="chip">${t}</span>`).join('');
}
function situacoesHtml(situacoes) {
  if (!situacoes || situacoes.length === 0) return '';
  return `<div class="situacoes">${situacoes.map(s => {
    if (s.cabecalho) return `<div class="situacao-cabecalho">${s.modalidade}</div>`;
    const passou = leilaoPassou(s.data);
    return `<div class="situacao-item${passou ? ' passado' : ''}">
      <span>${s.modalidade}${s.data ? `: ${s.data}` : ''}</span>
      <span class="situacao-valor">${formatarValor(s.valor)}</span>
    </div>`;
  }).join('')}</div>`;
}
function cardHtml(im) {
  const badgesFiltro = (im.filtros_correspondentes || []).map(n => `<span class="badge">${n}</span>`).join('');
  const badgeNovo = ehRecente(im.criado_em) ? '<span class="badge novo">Novo</span>' : '';
  const extras = [
    ['Matrícula', im.matricula], ['IPTU', im.iptu], ['Comarca', im.comarca],
    ['Edital', im.edital], ['Leiloeiro(a)', im.leiloeiro],
  ].filter(([, v]) => v).map(([r, v]) => `<div class="linha-extra"><span>${r}</span><span>${v}</span></div>`).join('');
  return `<div class="card imovel">
    <div class="imovel-topo">
      <div>
        ${badgesFiltro ? `<div class="badges-filtro">${badgesFiltro}</div>` : ''}
        <div class="imovel-numero">Imóvel nº ${im.numero_imovel}</div>
        <div class="imovel-local">${im.bairro} — ${im.cidade}/${im.uf} ${badgeNovo}</div>
        <div class="imovel-endereco">${im.endereco}
          <a class="link-maps" href="${linkMapa(im)}" target="_blank" rel="noopener">📍 Street View</a>
        </div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;">
        <div class="imovel-valor"><span class="rotulo-valor">Avaliação</span><span>${formatarValor(im.valor_avaliacao)}</span></div>
        <button class="btn-favorito ${im.favorito ? 'ativo' : ''}" onclick="toggleFavorito('${im.id}')">${im.favorito ? '★' : '☆'}</button>
      </div>
    </div>
    <div>${chipsFatos(im.fatos)}</div>
    ${situacoesHtml(montarSituacoes(im))}
    ${extras ? `<div class="extras">${extras}</div>` : ''}
    <div class="imovel-rodape">
      <span></span>
      <a href="${im.link}" target="_blank" rel="noopener">Ver imóvel no site da Caixa →</a>
    </div>
  </div>`;
}
async function toggleFavorito(id) {
  const im = resultadosCache.find(x => x.id === id);
  if (!im) return;
  im.favorito = !im.favorito;
  renderResultados();
  renderFavoritos();
  const { error } = await sb.from('imoveis').update({ favorito: im.favorito }).eq('id', id);
  if(error){
    im.favorito = !im.favorito; // desfaz se a gravação falhar
    renderResultados();
    renderFavoritos();
    alert('Não foi possível salvar o favorito: ' + error.message);
  }
}

// ---------------- resultados (busca, filtro-origem, bairro, ordenar, agrupar) ----------------
let bairrosSelecionados = new Set();
function atualizarPainelBairros(disponiveis) {
  const lista = document.getElementById('bairro-filtro-lista');
  const nomes = [...disponiveis.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  bairrosSelecionados = new Set([...bairrosSelecionados].filter(b => disponiveis.has(b)));
  lista.innerHTML = nomes.map(b => `<label class="bairro-filtro-item">
    <input type="checkbox" value="${b}" ${bairrosSelecionados.has(b) ? 'checked' : ''} onchange="alternarBairroSelecionado('${b.replace(/'/g, "\\'")}', this.checked)">
    ${b} <span class="contagem">${disponiveis.get(b)}</span>
  </label>`).join('');
  document.getElementById('bairro-filtro-resumo').textContent =
    bairrosSelecionados.size === 0 ? 'Todos os bairros' : `${bairrosSelecionados.size} bairro(s) selecionado(s)`;
}
function alternarBairroSelecionado(bairro, marcado) {
  if (marcado) bairrosSelecionados.add(bairro); else bairrosSelecionados.delete(bairro);
  renderResultados();
}
function limparSelecaoBairros() { bairrosSelecionados.clear(); renderResultados(); }

function agruparERenderizar(lista, destinoId) {
  const destino = document.getElementById(destinoId);
  if (lista.length === 0) {
    destino.innerHTML = '<div class="vazio"><h3>Nada por aqui ainda</h3><p>Assim que a busca encontrar algo, aparece nesta lista.</p></div>';
    return;
  }
  const grupos = new Map();
  lista.forEach(im => {
    if (!grupos.has(im.bairro)) grupos.set(im.bairro, []);
    grupos.get(im.bairro).push(im);
  });
  const bairrosOrdenados = [...grupos.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  destino.innerHTML = bairrosOrdenados.map(bairro => {
    const itens = [...grupos.get(bairro)].sort((a, b) => (a.valor_avaliacao || 0) - (b.valor_avaliacao || 0));
    return `<div class="grupo-bairro">
      <div class="grupo-bairro-titulo">${bairro} <span class="n">${itens.length}</span></div>
      ${itens.map(cardHtml).join('')}
    </div>`;
  }).join('');
}

function renderResultados() {
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const origem = document.getElementById('filtro-origem').value;
  const ordenar = document.getElementById('ordenar').value;

  let base = resultadosCache.filter(im => {
    if (origem && !(im.filtros_correspondentes || []).includes(origem)) return false;
    if (busca) {
      const alvo = [im.endereco, im.bairro, im.cidade].join(' ').toLowerCase();
      if (!alvo.includes(busca)) return false;
    }
    return true;
  });

  const contagemBairros = new Map();
  base.forEach(im => contagemBairros.set(im.bairro, (contagemBairros.get(im.bairro) || 0) + 1));
  atualizarPainelBairros(contagemBairros);

  let lista = bairrosSelecionados.size === 0 ? base : base.filter(im => bairrosSelecionados.has(im.bairro));

  document.getElementById('contagem').textContent = lista.length + (lista.length === 1 ? ' imóvel encontrado' : ' imóveis encontrados');

  if (ordenar === 'valor-asc' || ordenar === 'valor-desc') {
    const ordenados = [...lista].sort((a, b) => ordenar === 'valor-asc' ? (a.valor_avaliacao || 0) - (b.valor_avaliacao || 0) : (b.valor_avaliacao || 0) - (a.valor_avaliacao || 0));
    document.getElementById('grid-resultados').innerHTML = ordenados.length ? ordenados.map(cardHtml).join('') : '<div class="vazio"><h3>Nada por aqui ainda</h3></div>';
    return;
  }
  agruparERenderizar(lista, 'grid-resultados');
}

function renderFavoritos() {
  const lista = resultadosCache.filter(im => im.favorito);
  document.getElementById('contagem-favoritos').textContent = lista.length + (lista.length === 1 ? ' imóvel favoritado' : ' imóveis favoritados');
  agruparERenderizar(lista, 'grid-favoritos');
}

// ---------------- abas ----------------
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.tab).classList.add('active');
  });
});

document.getElementById('busca').addEventListener('input', renderResultados);
document.getElementById('filtro-origem').addEventListener('change', renderResultados);
document.getElementById('ordenar').addEventListener('change', renderResultados);

function iniciarApp() {
  carregarFiltros();
  carregarResultados();
}
</script>
</body>
</html>

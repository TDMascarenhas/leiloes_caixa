name: Atualizar Radar de Leilões Caixa

on:
  schedule:
    # Horários em Brasília (UTC-3) — GitHub Actions usa UTC, por isso a diferença:
    - cron: "0 13 * * *"   # 10:00 em Brasília
    - cron: "0 18 * * *"   # 15:00 em Brasília
    - cron: "0 23 * * *"   # 20:00 em Brasília
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

jobs:
  buscar-imoveis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar busca de imóveis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/buscar_imoveis.py

name: Atualizar Radar de Leilões Caixa

on:
  schedule:
    # Horários em Brasília (UTC-3). O GitHub Actions usa UTC (por isso 13h = 10h) e NÃO garante o minuto:
    # em horários de pico, no começo de cada hora, ele atrasa e até descarta agendamentos. Por isso as buscas
    # saem nos minutos 7 (principal) e 37 (reserva), fora do pico. A reserva só busca se a principal
    # não rodou (o robô confere, ver RADAR_RESERVA abaixo).
    - cron: "7 13 * * *"    # 10:07 principal
    - cron: "37 13 * * *"   # 10:37 reserva
    - cron: "7 18 * * *"    # 15:07 principal
    - cron: "37 18 * * *"   # 15:37 reserva
    - cron: "7 23 * * *"    # 20:07 principal (é nesta que saem os lembretes de véspera e o resumo do dia)
    - cron: "37 23 * * *"   # 20:37 reserva
  workflow_dispatch:       # permite rodar manualmente pela aba "Actions" no GitHub
    inputs:
      atualizar_detalhes:
        description: "Reler a página de detalhe de TODOS os imóveis (marque uma vez depois de uma melhoria na leitura)"
        type: boolean
        default: false

# Uma busca por vez: se a reserva começar enquanto a principal ainda roda, espera a principal terminar
# (e aí, por já haver busca recente, a reserva não faz nada).
concurrency:
  group: radar-busca
  cancel-in-progress: false

jobs:
  buscar-imoveis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar busca de imóveis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          PAINEL_URL: ${{ vars.PAINEL_URL }}
          RADAR_RESERVA: ${{ startsWith(github.event.schedule, '37 ') && 'sim' || 'nao' }}
        run: python scripts/buscar_imoveis.py ${{ inputs.atualizar_detalhes && '--atualizar-detalhes' || '' }}

      # Rede de segurança: se algo quebrou antes do próprio robô conseguir
      # avisar (ex.: falha ao instalar dependências, segredo faltando), manda
      # um aviso simples pro administrador. Se o robô já avisou, não repete.
      - name: Avisar administrador sobre falha
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "$RUNNER_TEMP/radar_alerta_enviado" ]; then exit 0; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            --data-urlencode "text=❌ Busca falhou antes de começar (erro no workflow do GitHub). Veja: ${LINK}" > /dev/null
